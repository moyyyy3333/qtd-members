const KS='qnt_member_key';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const u8b64=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(CFG.salt),iterations:CFG.iter,hash:'SHA-256'},base,256));
}
async function dec(raw,buf){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},k,buf.slice(12)));
}
async function open(raw){
  const page=new TextDecoder().decode(await dec(raw,b64(CFG.payload)));
  let html=page;
  const urls=await Promise.all(CFG.docs.map(async d=>{
    const r=await fetch('docs/'+encodeURIComponent(d.name)+'.enc',{cache:'no-cache'});
    if(!r.ok)throw new Error('doc '+d.name+' '+r.status);
    const plain=await dec(raw,new Uint8Array(await r.arrayBuffer()));
    return [d.name,URL.createObjectURL(new Blob([plain],{type:d.mime}))];
  }));
  for(const [n,u] of urls) html=html.split('docs/'+n).join(u);
  document.open();document.write(html);document.close();
}
async function tryStored(){
  const s=sessionStorage.getItem(KS)||localStorage.getItem(KS);
  if(!s)return false;
  try{await open(b64(s));return true}catch(e){sessionStorage.removeItem(KS);localStorage.removeItem(KS);return false}
}
const f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('b');
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Unlocking…';
  try{
    const raw=await derive(document.getElementById('pw').value.trim());
    try{await dec(raw,b64(CFG.payload))}catch(_){throw new Error('bad')}
    const s=u8b64(raw);sessionStorage.setItem(KS,s);
    if(document.getElementById('rem').checked)localStorage.setItem(KS,s);
    await open(raw);
  }catch(x){err.textContent=x.message==='bad'?'Wrong passphrase. Try again.':'Could not load: '+x.message;btn.disabled=false;btn.textContent='Open dashboard';}
});
if(!window.crypto||!crypto.subtle){err.textContent='This browser can’t unlock the page. Use a current Chrome, Safari, Edge or Firefox.';btn.disabled=true}
